name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: QianChenJun
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230ea5e9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338bdf8

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          build_dir: dist
          target_branch: gh-pages
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
